<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaKit - Motion Graphics & Video Editor</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #061830; color: #ffffff; display: flex; flex-direction: column; height: 100vh; }
    header { background: #041022; padding: 12px 16px; border-bottom: 2px solid #133E87; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 1.1rem; color: #00D8FF; }
    .logo-box { border: 2px solid #133E87; padding: 2px 6px; color: #00D8FF; font-weight: 900; }
    .btn { background: #133E87; color: #00D8FF; border: 1px solid #00D8FF; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .workspace { flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 16px; overflow-y: auto; }
    .preview-screen { position: relative; background: #000; border: 2px solid #133E87; border-radius: 8px; height: 240px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    video { max-width: 100%; max-height: 100%; }
    #motionText { position: absolute; color: #00D8FF; font-size: 1.8rem; font-weight: bold; text-shadow: 2px 2px 8px #000; pointer-events: none; transition: transform 0.4s ease; }
    .controls { background: #092142; padding: 14px; border-radius: 8px; border: 1px solid #133E87; display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    input[type="text"] { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #133E87; background: #061830; color: #fff; }
    .timeline { background: #041022; border: 1px solid #133E87; border-radius: 8px; padding: 12px; min-height: 90px; }
    .track { background: #133E87; color: #00D8FF; padding: 8px; border-radius: 4px; margin-top: 6px; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="logo-box">Mk</span> MediaKit Editor</div>
    <label class="btn">+ Import Video<input type="file" id="videoUpload" accept="video/*" hidden></label>
  </header>

  <div class="workspace">
    <div class="preview-screen">
      <video id="videoPlayer" controls></video>
      <div id="motionText">MediaKit Title</div>
    </div>

    <div class="controls">
      <div class="row">
        <input type="text" id="textInput" placeholder="Enter motion graphic text..." value="MediaKit Title">
        <button class="btn" onclick="animateText()">Animate Pop</button>
      </div>
      <div class="row">
        <button class="btn" onclick="applyFilter('none')">Normal</button>
        <button class="btn" onclick="applyFilter('contrast(140%) saturate(130%)')">Vivid</button>
        <button class="btn" onclick="applyFilter('grayscale(100%)')">B&W</button>
      </div>
    </div>

    <div class="timeline">
      <small style="color:#00D8FF;">TIMELINE TRACKS</small>
      <div class="track" id="videoTrack">Video Track: No video loaded</div>
      <div class="track">Motion Layer: MediaKit Title</div>
    </div>
  </div>

  <script>
    const upload = document.getElementById('videoUpload');
    const player = document.getElementById('videoPlayer');
    const textInput = document.getElementById('textInput');
    const motionText = document.getElementById('motionText');
    const videoTrack = document.getElementById('videoTrack');

    upload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        player.src = URL.createObjectURL(file);
        videoTrack.textContent = "Video Track: " + file.name;
      }
    });

    textInput.addEventListener('input', (e) => {
      motionText.textContent = e.target.value;
    });

    function animateText() {
      motionText.style.transform = 'scale(1.4)';
      setTimeout(() => motionText.style.transform = 'scale(1)', 400);
    }

    function applyFilter(filter) {
      player.style.filter = filter;
    }
  </script>
</body>
</html>
